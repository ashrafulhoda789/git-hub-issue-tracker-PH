<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Hub Issue Tracker | Login</title>

    <!-- Tailwind + daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Font integrate -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style/style.css">

</head>
<body class="flex justify-center  items-center min-h-screen bg-gray-200 font-geist">
    
    <section class="max-w-md m-auto pt-10  bg-white shadow-2xl rounded-3xl">
        <div class="w-[420px] mx-auto space-y-5 text-center flex justify-center flex-col items-center">
            <div>
                <img src="assets/github-logo.png" alt="">
            </div>
            <div class="space-y-2">
                <h2 class="text-2xl font-semibold dark-blue">GitHub Issues Tracker</h2>
                <p class="text-[#64748B]">Sign in to manage your issues</p>
            </div>
        </div>

        <div class="form pt-4">
            <div class="card w-[420px]  mx-auto">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-neutral font-semibold text-[16px]">Username</label>
                        <input id="input-username" type="text" class="input w-full bg-base-200" placeholder="Enter Username" />
                        <p class="mb-3">Default: admin</p>        

                        <label class="label text-[16px] text-neutral font-semibold">Password</label>
                        <input id="input-passwrod" minlength="4" type="password" class="input w-full bg-base-200" placeholder="Enter Password" />
                        <p>Default: admin123</p>
                        <div></div>
                        <button id="login-btn" class="btn btn-primary mt-4">Login</button>
                    </fieldset>
                </div>
            </div>
        </div>

    </section>
    
    <script src="script/login.js"></script>
</body>
</html>
